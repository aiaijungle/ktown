<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>K-Town Survival — Learn to read Korean</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF8C00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-Town">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--amber:#FF8C00;--rose:#E8546B;--ink:#1a1413;--ok:#27c093;
  --cute:'Jua','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --display:'Black Han Sans','Jua',sans-serif}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#2a1d12,#100a06 60%);color:#fff;
  min-height:100vh;display:flex;justify-content:center;word-break:keep-all;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:460px;min-height:100vh;padding:22px 20px 40px;display:flex;flex-direction:column;position:relative;z-index:1}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.bar .logo{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.04em;color:var(--amber)}
.bar .prog{flex:1;height:7px;background:#ffffff14;border-radius:99px;overflow:hidden}
.bar .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--rose));transition:width .5s}
.bar .me{font-size:13px;color:#cbb8a6;font-weight:700;white-space:nowrap}
.scene{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
h1{font-family:var(--cute);font-size:31px;font-weight:400;letter-spacing:-.01em;line-height:1.22}
h1 .a{color:var(--amber)}
.lead{color:#cbb8a6;font-size:15.5px;line-height:1.6;margin-top:12px}
.spacer{flex:1}
.btn{width:100%;font-family:var(--cute);font-size:18px;font-weight:400;letter-spacing:.01em;padding:16px;border:none;border-radius:15px;cursor:pointer;
  background:linear-gradient(135deg,var(--amber),var(--rose));color:#fff;transition:all .2s;margin-top:14px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #ff8c0055}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:#ffffff12;border:1px solid #ffffff22}
input.name{width:100%;font-size:19px;padding:16px;border-radius:14px;border:1px solid #ffffff26;background:#ffffff10;color:#fff;outline:none;text-align:center;transition:all .2s}
input.name:focus{border-color:var(--amber)}
.hanbig{font-family:var(--cute);font-size:84px;font-weight:400;text-align:center;margin:8px 0;animation:pop .5s}
.cap{text-align:center;color:#cbb8a6;font-size:14px}
/* lesson tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:22px 0}
.tile{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden}
.tile:hover{border-color:var(--amber);background:#ffffff18;transform:translateY(-2px)}
.tile.done{border-color:var(--ok);background:#27c09320}
.tile .h{font-size:30px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.tile.long .h{font-size:21px}
.tile .r{font-size:12px;color:#cbb8a6;margin-top:4px}
/* quiz choices */
.q{font-size:15px;color:#cbb8a6;margin-bottom:6px}
.signs{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.sign{display:flex;align-items:center;gap:14px;background:#ffffff0d;border:2px solid #ffffff1c;border-radius:16px;padding:16px 18px;cursor:pointer;transition:all .15s;text-align:left}
.sign:hover{border-color:#ffffff44}
.sign.right{border-color:var(--ok);background:#27c09322}
.sign.wrong{border-color:var(--rose);background:#e8546b22}
.sign .kr{font-size:26px;font-weight:800}
.sign .en{font-size:13px;color:#9b8a7a}
.spk{margin-left:auto;font-size:20px;opacity:.8}
/* passport */
.passport{background:linear-gradient(150deg,#1c2f6b,#2a1d6b);border:1px solid #ffffff22;border-radius:20px;padding:26px;text-align:center;position:relative;overflow:hidden;animation:pop .5s}
.passport::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,#ffffff22,transparent 40%)}
.passport .ttl{font-size:12px;letter-spacing:.22em;color:#aeb8e6;font-weight:800}
.passport .nm{font-family:var(--cute);font-size:42px;font-weight:400;margin:10px 0 2px}
.stamp{display:inline-block;margin-top:14px;border:3px solid var(--ok);color:var(--ok);border-radius:12px;
  padding:8px 16px;font-weight:800;font-size:16px;transform:rotate(-7deg);animation:pop .6s .2s both}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#fff;color:var(--ink);
  font-weight:700;font-size:14px;padding:12px 20px;border-radius:99px;opacity:0;transition:all .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.legal{color:#6f6256;font-size:11px;text-align:center;margin-top:18px;line-height:1.5}
/* share sheet */
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheetc{background:#161019;border:1px solid #ffffff1c;border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:22px 20px 28px;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheetc h3{font-size:17px;font-weight:800}.sheetc .ps{color:#cbb8a6;font-size:13px;margin:4px 0 16px}
.shareImg{width:100%;border-radius:14px;margin-bottom:16px;box-shadow:0 10px 30px #0007}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;padding:13px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff12;color:#fff;cursor:pointer;transition:all .15s}
.sbtn:hover{background:#ffffff1e}.sbtn.x{background:#000;border-color:#444}
.sclose{width:100%;margin-top:12px;background:none;border:none;color:#8c7c6c;font-size:14px;cursor:pointer}
/* juice */
.confetti{position:fixed;width:9px;height:9px;border-radius:2px;z-index:30;pointer-events:none;animation:cf .95s ease-out forwards}
.confetti.jamo{width:auto;height:auto;background:none;border-radius:0;font-weight:800;font-size:22px;line-height:1;text-shadow:0 1px 6px #0007}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.popup{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-family:var(--cute);font-size:29px;font-weight:400;color:#FFB000;text-shadow:0 2px 14px #000,0 0 20px #ff8c0088;z-index:31;pointer-events:none;white-space:nowrap;animation:pu 1.1s ease-out forwards}
@keyframes pu{0%{transform:translateX(-50%) scale(.4);opacity:0}25%{transform:translateX(-50%) scale(1.2);opacity:1}100%{transform:translateX(-50%) translateY(-70px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#FF8C0066,transparent 70%);z-index:29;pointer-events:none;animation:fl .5s ease-out forwards}
@keyframes fl{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.sign.right{animation:rpop .4s}@keyframes rpop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
/* word dex */
.dexbar{height:10px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.dexbar i{display:block;height:100%;background:linear-gradient(90deg,#27c093,#FF8C00);transition:width .5s}
.achv{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.badge{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid #ffffff22;background:#ffffff0d;color:#6f6256}
.badge.on{color:#1a1413;background:linear-gradient(135deg,#ffd166,#FF8C00);border-color:transparent}
.dexcat{margin-top:18px}.dexcat h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:7px}.dexcat .cnt{font-size:12px;color:#8c7c6c;font-weight:600;margin-left:auto}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.dcard{position:relative;background:#ffffff0a;border:1px solid #ffffff1c;border-radius:13px;padding:12px;cursor:pointer;transition:all .15s;opacity:.5}
.dcard.got{opacity:1;border-color:#27c09355;background:#27c0930f}
.dcard:hover{border-color:var(--amber);transform:translateY(-2px)}
.dcard .dk{font-size:20px;font-weight:800;white-space:nowrap}.dcard .dr{font-size:11px;color:#d98a3c;font-weight:700;margin-top:2px}.dcard .de{font-size:11.5px;color:#cbb8a6;margin-top:1px}
.dcard .dxe{display:none;font-size:11.5px;color:#9b8a7a;margin-top:8px;border-top:1px solid #ffffff14;padding-top:7px;line-height:1.5}
.dcard.open .dxe{display:block}
.dcard .chk{position:absolute;top:7px;right:9px;color:#27c093;font-weight:800;font-size:13px}
.langsel{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.langbtn{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid #ffffff22;background:#ffffff0d;color:#cbb8a6;cursor:pointer;transition:all .15s}
.langbtn.on{background:linear-gradient(135deg,#FF8C00,#E8546B);color:#fff;border-color:transparent}
.visct{text-align:center;font-size:12.5px;color:#27c093;font-weight:700;margin-bottom:12px;min-height:16px;letter-spacing:.01em}
/* 타이틀 사진 슬라이드 (중앙) */
.slideshow{position:relative;flex:1;min-height:170px;max-height:320px;margin:14px 0 4px;border-radius:18px;overflow:hidden;border:1px solid #ffffff20;background:#0c0805;box-shadow:0 12px 34px #0006}
.slideshow .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .55s ease}
.slideshow .sl.on{opacity:1;animation:slken 6s ease-in-out infinite alternate}
@keyframes slken{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.slideshow::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000b);pointer-events:none;z-index:1}
.slcap{position:absolute;left:16px;bottom:13px;z-index:2;font-family:var(--cute);font-size:28px;font-weight:400;color:#fff;text-shadow:0 2px 12px #000;line-height:1.1;opacity:1;transition:opacity .35s ease}
.slcap .r{display:block;font-size:12.5px;font-weight:600;color:#ffd166;margin-top:2px}
.slcap .spk{position:absolute;right:-2px;top:-40px;font-size:17px;opacity:.85}
.sldots{position:absolute;right:13px;bottom:15px;z-index:2;display:flex;gap:5px}
.sldots i{width:6px;height:6px;border-radius:99px;background:#ffffff44}
.sldots i.on{background:var(--amber);width:16px}
/* 100일 1만명 챌린지 배너 (첫 화면) */
.challenge{background:linear-gradient(135deg,#ff8c0026,#e8546b22);border:1px solid #ff8c0055;border-radius:14px;padding:11px 14px;margin-bottom:13px}
.chTop{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}
.chGoal{color:var(--amber);letter-spacing:.01em}
.chLive{color:#27c093;display:flex;align-items:center;gap:5px}
.chLive .dot{width:8px;height:8px;border-radius:99px;background:#27c093;box-shadow:0 0 0 0 #27c09399;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #27c09399}70%{box-shadow:0 0 0 7px #27c09300}100%{box-shadow:0 0 0 0 #27c09300}}
.chHead{font-family:var(--cute);font-size:18px;margin:7px 0 8px;color:#fff;line-height:1.2}
.chHead b{color:var(--amber)}
.chBar{height:8px;background:#ffffff1a;border-radius:99px;overflow:hidden}
.chBar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--rose));transition:width .7s;min-width:4px}
.chSub{font-size:11.5px;color:#cbb8a6;margin-top:6px;font-weight:700}
/* 학습 가이드 텍스트 */
.guide{font-size:13px;color:#ffd9a6;background:#ff8c0014;border:1px solid #ff8c0033;border-radius:11px;padding:9px 12px;margin:10px 0 4px;line-height:1.45;font-weight:600}
.guide b{color:var(--amber)}
/* 3D 한글 비 (타이틀 인트로) */
#rain{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;perspective:700px}
.rdrop{position:absolute;top:0;font-weight:800;white-space:nowrap;text-align:center;will-change:transform,opacity;animation:rfall linear infinite;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.rdrop .rr{display:block;font-size:.46em;font-weight:600;opacity:.82;letter-spacing:.03em}
@keyframes rfall{0%{transform:translateY(-16vh) translateZ(var(--z)) rotateX(0deg) rotateZ(0deg);opacity:0}12%{opacity:var(--o)}86%{opacity:var(--o)}100%{transform:translateY(118vh) translateZ(var(--z)) rotateX(400deg) rotateZ(8deg);opacity:0}}
@media(max-width:480px){h1{font-size:25px}.hanbig{font-size:64px}}
</style></head>
<body>
<div id="app">
  <div class="bar">
    <span class="logo">🐯 K-TOWN</span>
    <span class="prog"><i id="prog"></i></span>
    <span class="me" id="me"></span>
  </div>
  <div class="scene" id="scene"></div>
</div>
<div class="toast" id="toast"></div>
<canvas id="cardCanvas" width="900" height="1125" style="display:none"></canvas>
<div class="sheet" id="sheet"><div class="sheetc" id="sheetc"></div></div>

<script src="worddex.js"></script>
<script src="i18n.js"></script>
<script src="audio_map.js"></script>
<script>
/* ===== Hangul transliterator (shared with namecard) ===== */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function compose(c,j,k){const ci=CHO.indexOf(c),ji=JUNG.indexOf(j),ki=k?JONG.indexOf(k):0;
  if(ci<0||ji<0)return(c||'')+(j||'');return String.fromCharCode(0xAC00+ci*588+ji*28+(ki<0?0:ki));}
const FINAL={'ㄴ':1,'ㅁ':1,'ㅇ':1,'ㄹ':1,'ㄱ':1,'ㅂ':1};
const C={b:'ㅂ',c:'ㅋ',d:'ㄷ',f:'ㅍ',g:'ㄱ',h:'ㅎ',j:'ㅈ',k:'ㅋ',l:'ㄹ',m:'ㅁ',n:'ㄴ',p:'ㅍ',q:'ㅋ',r:'ㄹ',s:'ㅅ',t:'ㅌ',v:'ㅂ',w:'ㅇ',x:'ㅋ',z:'ㅈ'};
const V={a:'ㅏ',e:'ㅔ',i:'ㅣ',o:'ㅗ',u:'ㅜ'};
const TRAIL={b:'브',c:'크',d:'드',f:'프',g:'그',j:'지',k:'크',p:'프',q:'크',s:'스',t:'트',v:'브',x:'크',z:'즈'};
function attachJong(s,k){const l=s[s.length-1],code=l.charCodeAt(0)-0xAC00;
  if(code>=0&&code<11172){const ci=(code/588)|0,ji=((code%588)/28)|0,ki=code%28;
    if(ki===0)return s.slice(0,-1)+String.fromCharCode(0xAC00+ci*588+ji*28+JONG.indexOf(k));}return s+k;}
function canJong(s){const l=s[s.length-1],code=l.charCodeAt(0)-0xAC00;if(code<0||code>=11172)return false;return code%28===0;}
function yC(v){return({'ㅏ':'ㅑ','ㅓ':'ㅕ','ㅗ':'ㅛ','ㅜ':'ㅠ','ㅔ':'ㅖ','ㅐ':'ㅒ','ㅣ':'ㅣ'})[v]||v;}
function wC(v){return({'ㅏ':'ㅘ','ㅓ':'ㅝ','ㅔ':'ㅞ','ㅐ':'ㅙ','ㅣ':'ㅟ','ㅗ':'ㅘ'})[v]||v;}
function transWord(w){
  w=w.replace(/chr/g,'kr').replace(/sch/g,'sk');
  w=w.replace(/tch/g,'ch').replace(/dge/g,'j').replace(/ck/g,'k').replace(/ph/g,'f')
     .replace(/sh/g,'S').replace(/ch/g,'C').replace(/th/g,'s').replace(/ng\b/g,'N')
     .replace(/oo/g,'u').replace(/ee/g,'i').replace(/ea/g,'i').replace(/oa/g,'o')
     .replace(/ai/g,'A').replace(/ay/g,'A').replace(/ei/g,'A').replace(/ie/g,'i')
     .replace(/ou/g,'W').replace(/qu/g,'kw');
  w=w.replace(/c([eiy])/g,'s$1');
  if(w.length>1)w=w[0]+w.slice(1).replace(/h/g,'');
  w=w.replace(/([bcdfgjklmnpqrstvxzCS])e$/,'$1');
  w=w.replace(/([a-zA-Z])\1+/g,'$1');
  const T=[];
  for(let i=0;i<w.length;i++){const ch=w[i];
    if('aeiou'.includes(ch))T.push({t:'V',v:V[ch]});
    else if(ch==='A')T.push({t:'V',v:'ㅔ',pre:'이'});
    else if(ch==='W')T.push({t:'V',v:'ㅏ',post:'우'});
    else if(ch==='S')T.push({t:'C',c:'ㅅ'});
    else if(ch==='C')T.push({t:'C',c:'ㅊ'});
    else if(ch==='N')T.push({t:'F'});
    else if(ch==='w')T.push({t:'C',c:'ㅇ',w:true});
    else if(ch==='y'){const nx=w[i+1];T.push(nx&&'aeiou'.includes(nx)?{t:'Y'}:{t:'V',v:'ㅣ'});}
    else if(C[ch])T.push({t:'C',c:C[ch],ch});}
  let o='';
  for(let i=0;i<T.length;i++){const tk=T[i];
    if(tk.t==='V'){o+=compose('ㅇ',tk.v);if(tk.pre)o+=tk.pre;if(tk.post)o+=tk.post;}
    else if(tk.t==='Y'){const nv=T[i+1];if(nv&&nv.t==='V'){o+=compose('ㅇ',yC(nv.v));i++;}else o+='이';}
    else if(tk.t==='C'){const nx=T[i+1];
      if(nx&&nx.t==='V'){let v=nx.v;if(tk.w)v=wC(v);o+=compose(tk.c,v);if(nx.pre)o+=nx.pre;if(nx.post)o+=nx.post;i++;continue;}
      if(nx&&nx.t==='Y'){const nv=T[i+2];if(nv&&nv.t==='V'){o+=compose(tk.c,yC(nv.v));i+=2;continue;}}
      if(tk.ch&&FINAL[tk.c]&&o.length&&canJong(o))o=attachJong(o,tk.c);
      else if(tk.ch&&TRAIL[tk.ch])o+=TRAIL[tk.ch];else o+=compose(tk.c,'ㅡ');}
    else if(tk.t==='F'){if(o.length&&canJong(o))o=attachJong(o,'ㅇ');else o+='응';}}
  return o;
}
function translit(s){s=s.toLowerCase().replace(/[^a-z ]/g,'');if(!s.trim())return'';
  return s.split(/\s+/).filter(Boolean).map(transWord).join(' ');}

/* ===== audio (MVP: Web Speech ko-KR; edge-tts 사전생성으로 업그레이드 예정) ===== */
function say(t){
  if(typeof AUDIO!=='undefined' && AUDIO[t]){try{const a=new Audio('audio/'+AUDIO[t]);a.play();return;}catch(e){}}
  try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ===== game state ===== */
const S={name:'',han:'',step:0,total:11,mi:0,xp:0,combo:0,streak:0,last:'',collected:[],achv:[],bkPrompted:false};
const $=id=>document.getElementById(id);
const scene=$('scene');
function setProg(n){S.step=n;$('prog').style.width=(n/S.total*100)+'%';$('me').innerHTML=(S.streak?'🔥 '+S.streak+' &nbsp; ':'')+'⭐ '+S.xp;}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600);}
/* ===== juice: sound · confetti · popup · streak/XP state ===== */
let AC;function actx(){try{return AC||(AC=new (window.AudioContext||window.webkitAudioContext)());}catch(e){return null;}}
function beep(f,d,t='sine',v=.14){const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);const now=c.currentTime;o.start(now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.stop(now+d);}
function sndCorrect(combo){beep(620+combo*50,.1,'triangle');setTimeout(()=>beep(860+combo*50,.12,'triangle'),80);}
function sndWrong(){beep(150,.2,'sawtooth',.1);}
function sndStamp(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.16),i*85));}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

  d.style.left=x+'px';d.style.top=y+'px';
  if(i%2){d.classList.add('jamo');d.textContent=CFJAMO[Math.floor(Math.random()*CFJAMO.length)];d.style.color=CFC[i%CFC.length];}
  else{d.style.background=CFC[i%CFC.length];}
  const a=Math.PI*2*Math.random(),s=70+Math.random()*180;
  d.style.setProperty('--dx',(Math.cos(a)*s)+'px');d.style.setProperty('--dy',(Math.sin(a)*s-90)+'px');
  d.style.setProperty('--rot',(Math.random()*720-360)+'deg');

function norm(s){return s.replace(/\s/g,'');}
function allWords(){return (typeof WORDDEX!=='undefined'?WORDDEX:[]).flatMap(c=>c.items);}
function isGot(kr){return S.collected.some(c=>norm(c)===norm(kr));}
function dexGot(){return allWords().filter(w=>isGot(w.kr)).length;}
function catDone(name){const c=(typeof WORDDEX!=='undefined'?WORDDEX:[]).find(x=>x.cat.includes(name));return c&&c.items.every(i=>isGot(i.kr));}

function openSheet(cv,text,url){const data=cv.toDataURL('image/png');
  const native=navigator.share?`<button class="sbtn" id="snative" style="grid-column:1/-1;background:linear-gradient(135deg,#FF8C00,#E8546B);border:none">📲 Share to any app — Instagram · TikTok · Kakao…</button>`:'';

  if(native)$('snative').onclick=async()=>{try{const b=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([b],'ktown-passport.png',{type:'image/png'});(navigator.canShare&&navigator.canShare({files:[f]}))?await navigator.share({files:[f],text,url}):await navigator.share({text,url});}catch(err){}};
  $('sheetc').querySelectorAll('[data-id]').forEach(b=>{const p=PLATS.find(x=>x.id===b.dataset.id);b.onclick=()=>window.open(p.u(text,url),'_blank','noopener');});

function dex(){const total=allWords().length,got=dexGot();
  scene.innerHTML=`<div class="langsel" id="langsel"></div><h1>📖 <span class="a">${t('dexTitle')}</span></h1>
    <p class="lead">Your Korean collection — tap a card to hear it 🔊 + collect it. Tap again to flip for a real sentence.</p>
    <div class="dexbar"><i id="dexfill" style="width:${total?got/total*100:0}%"></i></div>
    <p class="cap" style="text-align:left;color:#8c7c6c"><b id="dexn" style="color:#27c093">${got}</b> / ${total} ${t('collected')}</p>
    <div class="achv" id="achv"></div>
    <div id="dexwrap"></div>
    <button class="btn" id="share">${t('shareName')}</button>
    <button class="btn ghost" id="backup">${t('backupBtn')}</button>
    <button class="btn ghost" id="back">${t('back')}</button>`;
  renderLangSel();
  $('backup').onclick=backupForm;
  const ab=$('achv');ACHV.forEach(a=>{const b=document.createElement('span');b.className='badge'+(S.achv.includes(a.id)?' on':'');b.textContent=a.n;ab.appendChild(b);});
  const w=$('dexwrap');
  WORDDEX.forEach(cat=>{const sec=document.createElement('div');sec.className='dexcat';
    sec.innerHTML=`<h2>${cat.cat}<span class="cnt">${cat.items.filter(i=>isGot(i.kr)).length}/${cat.items.length}</span></h2>`;
    const grid=document.createElement('div');grid.className='dexgrid';
    cat.items.forEach(it=>{const card=document.createElement('div');card.className='dcard'+(isGot(it.kr)?' got':'');
      card.innerHTML=`<div class="dk">${it.kr}</div><div class="dr">${it.r}</div><div class="de">${mean(it.kr)||it.en}</div><div class="dxe">${it.ex}<br><i>${exT(it.kr)||it.exen}</i></div><span class="chk">${isGot(it.kr)?'✓':''}</span>`;
      card.onclick=()=>{say(it.kr);card.classList.toggle('open');
        if(addCollected(it.kr)){card.classList.add('got');card.querySelector('.chk').textContent='✓';
          const r=card.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,14);sndCorrect(1);
          sec.querySelector('.cnt').textContent=cat.items.filter(i=>isGot(i.kr)).length+'/'+cat.items.length;
          const ng=dexGot();$('dexn').textContent=ng;$('dexfill').style.width=(ng/total*100)+'%';}
      };grid.appendChild(card);});
    sec.appendChild(grid);w.appendChild(sec);});
  $('back').onclick=()=>S.han?passport(S.mi):title();
  $('share').onclick=()=>{const cv=renderCard();openSheet(cv,`I can read & understand ${dexGot()} Korean words after playing K-Town! 🇰🇷 Can you read yours?`,shareUrl());};
}
/* ===== 외국인 DB 캡처 — "진도 백업" 동의 훅 (시황 설계: 로컬=진도, 서버=동의기반 이메일) ===== */
const BACKUP_ENDPOINT=''; // ⚠️ CEO: Supabase Edge Function/REST (foreign_leads insert) URL. 비어있으면 로컬만 저장.
/* ===== 국적/방문자 추적 (익명 집계 — 국가코드·언어·유입 ref. PII 없음) ===== */
const VISIT_ENDPOINT=''; // ⚠️ CEO: Supabase visitors insert URL. 비어있으면 로컬 집계만.
function trackVisit(){
  const loc=navigator.language||'';
  const country=(loc.split('-')[1]||'').toUpperCase();          // 브라우저 로캘의 국가코드(MX·JP·TW…)
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){}  // 타임존=국가 보조신호
  const v={country,locale:loc,gameLang:getLang(),tz,ref:(new URLSearchParams(location.search).get('ref')||''),ts:new Date().toISOString()};
  try{const t=JSON.parse(localStorage.getItem('ktownVisits')||'{}');const k=country||'??';t[k]=(t[k]||0)+1;localStorage.setItem('ktownVisits',JSON.stringify(t));}catch(e){}
  try{if(VISIT_ENDPOINT)fetch(VISIT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v),keepalive:true});}catch(e){}
  // 눈에 보이는 실시간 방문자 카운터 (무료·무계정 Abacus)
  try{fetch('https://abacus.jasoncameron.dev/hit/ktown-korean/visits').then(r=>r.json()).then(d=>{VISITORS=d.value||0;renderVisitors();}).catch(()=>{});}catch(e){}
}

function backupForm(onDone){

    <input id="bkEmail" type="email" autocomplete="email" placeholder="${t('emailPh')}" style="width:100%;font-size:16px;padding:13px;border-radius:12px;border:1px solid #ffffff26;background:#ffffff10;color:#fff;outline:none;margin-bottom:10px">

    <button class="btn" id="bkGo" style="width:100%">${t('backupGo')}</button>
    <button class="sclose" id="bkClose">${onDone?t('later'):t('back')}</button>`;
  $('sheet').classList.add('on');

    try{localStorage.setItem('ktownLead',JSON.stringify(lead));}catch(e){}      // 로컬 백업
    try{ if(BACKUP_ENDPOINT) await fetch(BACKUP_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)});}catch(e){} // 서버(동의기반)
    toast(t('backupOk'));setTimeout(()=>{$('sheet').classList.remove('on');if(onDone)onDone();},1300);
  };
}

let deferredPrompt;

  const b=document.createElement('button');b.id='installBtn';b.textContent=t('install');
  b.style.cssText='position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;background:linear-gradient(135deg,#FF8C00,#E8546B);color:#fff;border:none;font-weight:800;padding:11px 20px;border-radius:99px;box-shadow:0 6px 20px #0008;cursor:pointer;font-size:14px';
  b.onclick=async()=>{b.remove();deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;};
